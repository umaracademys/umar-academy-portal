services:
  # Backend API Service
  - type: web
    name: umar-academy-backend
    env: node
    plan: free
    buildCommand: corepack prepare pnpm@9.0.0 --activate && if [ -f "server.js" ] && [ -f "package.json" ]; then pnpm install --frozen-lockfile --prefer-offline; elif [ -d "backend" ]; then cd backend && pnpm install --frozen-lockfile --prefer-offline; else echo "Error: Backend directory not found. Current dir: $(pwd)" && ls -la && exit 1; fi
    # Note: Backend doesn't need a build step, just install dependencies
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard
      - key: FRONTEND_URL
        value: https://umar-academy-portal.onrender.com  # Update after frontend deployment
    healthCheckPath: /api/health

  # Frontend Service
  - type: web
    name: umar-academy-frontend
    env: node
    plan: free
    buildCommand: bash render-build.sh
    startCommand: node frontend-server.js
    envVars:
      - key: VITE_API_BASE_URL
        value: https://umar-academy-backend.onrender.com/api  # Update with your backend URL
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health

