services:
  # Backend API Service
  - type: web
    name: umar-academy-backend
    env: node
    plan: free
    buildCommand: corepack prepare pnpm@9.0.0 --activate && (cd backend 2>/dev/null || find . -name "server.js" -type f -path "*/backend/*" | head -1 | xargs dirname | xargs -I {} sh -c 'cd {} && pwd') | xargs -I {} sh -c 'cd {} && pnpm install --frozen-lockfile --prefer-offline' || (pwd && ls -la && echo "Backend directory not found")
    # Note: Backend doesn't need a build step, just install dependencies
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard
      - key: FRONTEND_URL
        value: https://umar-academy-portal.onrender.com  # Update after frontend deployment
    healthCheckPath: /api/health

  # Frontend Service
  - type: web
    name: umar-academy-frontend
    env: node
    plan: free
    buildCommand: bash render-build.sh
    startCommand: node frontend-server.js
    envVars:
      - key: VITE_API_BASE_URL
        value: https://umar-academy-backend.onrender.com/api  # Update with your backend URL
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health

