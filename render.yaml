services:
  # Backend API Service
  - type: web
    name: umar-academy-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard
      - key: FRONTEND_URL
        value: https://umar-academy-portal.onrender.com  # Update after frontend deployment
    healthCheckPath: /api/health

  # Frontend Service
  - type: web
    name: umar-academy-frontend
    env: node
    plan: free
    buildCommand: npx -y pnpm@9.0.0 install --frozen-lockfile --no-optional --prefer-offline && npx -y pnpm@9.0.0 --filter @umar-academy/mushaf build && npx -y pnpm@9.0.0 run build:fast
    startCommand: npm start
    envVars:
      - key: VITE_API_BASE_URL
        value: https://umar-academy-backend.onrender.com/api  # Update with your backend URL
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health

